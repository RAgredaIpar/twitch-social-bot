name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run go vet & tests
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Build Windows binary
        run: |
          mkdir -p dist/package
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" \
            -o dist/package/twitch-social-bot.exe ./cmd/bot

      - name: Package release bundle
        run: |
          cp .env.example README.md README.es.md SOUL.md SOUL.es.md dist/package/
          cp -r personas locales dist/package/
          (cd dist/package && zip -r ../twitch-social-bot-windows.zip .)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist/twitch-social-bot-windows.zip
